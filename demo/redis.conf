# demo/redis.conf
# Official Redis Server Configuration for sysdhardener Sandbox Testing

port 6379
bind 127.0.0.1
protected-mode no
daemonize no

# The demo intentionally exercises runtime CONFIG SET dir/dbfilename writes.
# Keep Redis bound to localhost and use this only in the isolated demo.
enable-protected-configs yes

# Default data directory where Redis writes snapshots (dump.rdb)
dir ./demo/data
dbfilename dump.rdb

# Snapshot schedule
save 60 1

# Logging
loglevel notice
logfile ""
