[package]
name = "sysdhardener-observer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Live syscall observer for sysdhardener: ptrace-based capture of a target process's address-family syscalls."

[lints]
workspace = true

[dependencies]
sysdhardener-core = { path = "../sysdhardener-core", version = "0.1.0" }
libc = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Self dev-dependency: lets the integration tests use the
# `test-target` feature (the syscall_target binary) under a plain
# `cargo test`. The explicit version pins the requirement so
# cargo-deny does not treat the self-reference as a wildcard.
sysdhardener-observer = { version = "0.1.0", path = ".", features = ["test-target"] }

[features]
# Builds the `syscall_target` binary used by the integration tests to
# exercise real syscall combinations. Off by default so production
# builds never ship the test target.
test-target = []

[[bin]]
name = "syscall_target"
path = "src/bin/syscall_target.rs"
required-features = ["test-target"]

[[bin]]
name = "sleepy_target"
path = "src/bin/sleepy_target.rs"
required-features = ["test-target"]

[[bin]]
name = "daemon_target"
path = "src/bin/daemon_target.rs"
required-features = ["test-target"]

[[bin]]
name = "capability_target"
path = "src/bin/capability_target.rs"
required-features = ["test-target"]

[[bin]]
name = "repeating_target"
path = "src/bin/repeating_target.rs"
required-features = ["test-target"]

[[bin]]
name = "threaded_target"
path = "src/bin/threaded_target.rs"
required-features = ["test-target"]

[[bin]]
name = "exec_target"
path = "src/bin/exec_target.rs"
required-features = ["test-target"]

[[bin]]
name = "fs_target"
path = "src/bin/fs_target.rs"
required-features = ["test-target"]

