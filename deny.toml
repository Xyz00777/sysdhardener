[graph]
all-features = true

[advisories]
version = 2
# Default advisory source (the live RustSec advisory-db). The locked
# nixpkgs (nixos-26.05) ships cargo-deny 0.20.2, which understands the
# current CVSS 4.0 format; no override is needed.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# License allow-list is derived from the dependency graph. Adding a
# dep that uses a new license without updating this list will fail the
# `cargo deny check` license gate, which is the intended behavior.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
